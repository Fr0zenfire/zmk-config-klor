# Support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_KEYMAP_SENSORS=y

# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Prospector status screen layout
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# Manual brightness mode (controlled by rotary encoder)
CONFIG_PROSPECTOR_BRIGHTNESS_MANUAL=y
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
CONFIG_PROSPECTOR_BRIGHTNESS_STEP=5

# Display auto-sleep on idle (wakes on any key or encoder turn)
CONFIG_PROSPECTOR_DISPLAY_SLEEP_ENABLE=y
CONFIG_PROSPECTOR_DISPLAY_IDLE_TIMEOUT_MS=60000

CONFIG_PROSPECTOR_SHOW_INACTIVE_MODIFIERS=n

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Bluetooth connection limits (2 peripherals for split halves + 5 host profiles)
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Bluetooth connection stability and Apple/macOS security support
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
